<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0F172A"/>

  <text x="540" y="200" font-family="Arial, sans-serif" font-size="80" fill="white" text-anchor="middle" font-weight="bold">What Force Does</text>
  <text x="540" y="280" font-family="Arial, sans-serif" font-size="50" fill="white" text-anchor="middle">Change in State of Motion</text>

  <!-- Makes still move -->
  <g transform="translate(100, 400)">
    <rect x="0" y="0" width="100" height="100" fill="#E0E0E0" stroke="#777" stroke-width="3"/>
    <text x="50" y="170" font-family="Arial, sans-serif" font-size="35" fill="white" text-anchor="middle">Rest</text>
    <path d="M 120 50 L 200 50 M 180 35 L 200 50 L 180 65" stroke="#6366F1" stroke-width="10" fill="none"/>
    <text x="250" y="50" font-family="Arial, sans-serif" font-size="35" fill="white" text-anchor="start" alignment-baseline="middle">→ Move</text>
  </g>

  <!-- Makes moving stop -->
  <g transform="translate(100, 650)">
    <rect x="100" y="0" width="100" height="100" fill="#E0E0E0" stroke="#777" stroke-width="3"/>
    <path d="M 0 50 L 90 50 M 20 35 L 0 50 L 20 65" stroke="#F43F5E" stroke-width="10" fill="none"/>
    <text x="50" y="170" font-family="Arial, sans-serif" font-size="35" fill="white" text-anchor="middle">Move</text>
    <text x="-20" y="50" font-family="Arial, sans-serif" font-size="35" fill="white" text-anchor="end" alignment-baseline="middle">Stop ←</text>
  </g>

  <!-- Speeds up -->
  <g transform="translate(580, 400)">
    <circle cx="50" cy="50" r="50" fill="#E0E0E0" stroke="#777" stroke-width="3"/>
    <text x="50" y="170" font-family="Arial, sans-serif" font-size="35" fill="white" text-anchor="middle">Speed Up</text>
    <path d="M 100 50 L 170 50 M 150 35 L 170 50 L 150 65" stroke="#10B981" stroke-width="10" fill="none"/>
    <path d="M 110 50 L 160 50 M 140 35 L 160 50 L 140 65" stroke="#10B981" stroke-width="10" fill="none" opacity="0.5"/>
  </g>

  <!-- Slows down -->
  <g transform="translate(580, 650)">
    <circle cx="100" cy="50" r="50" fill="#E0E0E0" stroke="#777" stroke-width="3"/>
    <text x="100" y="170" font-family="Arial, sans-serif" font-size="35" fill="white" text-anchor="middle">Slow Down</text>
    <path d="M 0 50 L 70 50 M 20 35 L 0 50 L 20 65" stroke="#F43F5E" stroke-width="10" fill="none"/>
    <path d="M 10 50 L 60 50 M 30 35 L 10 50 L 30 65" stroke="#F43F5E" stroke-width="10" fill="none" opacity="0.5"/>
  </g>

  <!-- Change Direction -->
  <g transform="translate(300, 900)">
    <circle cx="100" cy="100" r="50" fill="#E0E0E0" stroke="#777" stroke-width="3"/>
    <path d="M 50 50 L 100 0 M 90 20 L 100 0 L 110 20" stroke="#6366F1" stroke-width="10" fill="none"/>
    <path d="M 100 100 L 150 50 M 130 60 L 150 50 L 140 70" stroke="#10B981" stroke-width="10" fill="none"/>
    <text x="100" y="220" font-family="Arial, sans-serif" font-size="35" fill="white" text-anchor="middle">Change Direction</text>
  </g>

  <rect x="100" y="1200" width="880" height="200" rx="20" ry="20" fill="rgba(255,255,255,0.05)" stroke="#10B981" stroke-width="5"/>
  <text x="540" y="1280" font-family="Arial, sans-serif" font-size="50" fill="white" text-anchor="middle" font-weight="bold">Simply put,</text>
  <text x="540" y="1350" font-family="Arial, sans-serif" font-size="70" fill="#6366F1" text-anchor="middle" font-weight="bold">a force is a PUSH or a PULL.</text>

</svg>