<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1080 1920' style='background-color: #0F172A;'><rect width="100%" height="100%" fill="#0F172A" /> <defs> <marker id='arrowhead-indigo' markerWidth='10' markerHeight='7' refX='0' refY='3.5' orient='auto'> <polygon points='0 0, 10 3.5, 0 7' fill='#6366F1' /> </marker> <marker id='arrowhead-emerald' markerWidth='10' markerHeight='7' refX='0' refY='3.5' orient='auto'> <polygon points='0 0, 10 3.5, 0 7' fill='#10B981' /> </marker> </defs> <text x='540' y='180' font-family='Arial, sans-serif' font-size='80' fill='white' text-anchor='middle'>The Famous Equation!</text> <text x='540' y='270' font-family='Arial, sans-serif' font-size='60' fill='white' text-anchor='middle'>Newton's Second Law (simplified)</text> <rect x='390' y='680' width='300' height='300' fill='#F43F5E' rx='40' ry='40'/> <text x='540' y='840' font-family='Arial, sans-serif' font-size='100' fill='white' text-anchor='middle'>m</text> <line x1='190' y1='830' x2='390' y2='830' stroke='#6366F1' stroke-width='20' marker-end='url(#arrowhead-indigo)'/> <text x='290' y='770' font-family='Arial, sans-serif' font-size='70' fill='#6366F1' text-anchor='middle'>F</text> <line x1='690' y1='830' x2='990' y2='830' stroke='#10B981' stroke-width='20' marker-end='url(#arrowhead-emerald)'/> <text x='840' y='770' font-family='Arial, sans-serif' font-size='70' fill='#10B981' text-anchor='middle'>a</text> <text x='540' y='1400' font-family='Arial, sans-serif' font-size='150' fill='white' text-anchor='middle'>F = m × a</text> </svg>