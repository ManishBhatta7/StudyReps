<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#0F172A" />
  <rect width="1080" height="1920" fill="#0F172A"/>

  <!-- Object 1 (Circle) -->
  <circle cx="300" cy="800" r="150" fill="#6366F1"/>
  <text x="300" y="810" font-family="Arial, sans-serif" font-size="64" fill="#E2E8F0" text-anchor="middle">1</text>

  <!-- Object 2 (Square) -->
  <rect x="630" y="650" width="300" height="300" fill="#F43F5E" rx="30"/>
  <text x="780" y="810" font-family="Arial, sans-serif" font-size="64" fill="#E2E8F0" text-anchor="middle">2</text>

  <!-- F12 (Force of 1 on 2) -->
  <path d="M450 800 H630 M630 800 L610 780 M630 800 L610 820" stroke="#F43F5E" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="540" y="750" font-family="Arial, sans-serif" font-size="48" fill="#F43F5E" text-anchor="middle">F₁₂</text>

  <!-- F21 (Force of 2 on 1) -->
  <path d="M630 900 H450 M450 900 L470 880 M450 900 L470 920" stroke="#6366F1" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="540" y="950" font-family="Arial, sans-serif" font-size="48" fill="#6366F1" text-anchor="middle">F₂₁</text>

  <!-- Formula -->
  <text x="540" y="300" font-family="Arial, sans-serif" font-size="96" fill="#10B981" text-anchor="middle">F₁₂ = -F₂₁</text>
  <text x="540" y="400" font-family="Arial, sans-serif" font-size="48" fill="#A0AEC0" text-anchor="middle">Equal Magnitude, Opposite Direction</text>

  <!-- Key Principle -->
  <text x="540" y="1200" font-family="Arial, sans-serif" font-size="64" fill="#E2E8F0" text-anchor="middle">Forces act on</text>
  <text x="540" y="1280" font-family="Arial, sans-serif" font-size="80" fill="#F43F5E" text-anchor="middle">DIFFERENT BODIES!</text>
  <text x="540" y="1400" font-family="Arial, sans-serif" font-size="48" fill="#A0AEC0" text-anchor="middle">They NEVER cancel each other out.</text>

</svg>