<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0F172A"/>

  <text x="540" y="200" font-family="Arial, sans-serif" font-size="80" fill="white" text-anchor="middle" font-weight="bold">Types of Forces</text>
  <text x="540" y="280" font-family="Arial, sans-serif" font-size="60" fill="#10B981" text-anchor="middle" font-weight="bold">Contact Forces</text>
  <text x="540" y="350" font-family="Arial, sans-serif" font-size="40" fill="white" text-anchor="middle">Require two objects to physically touch.</text>

  <!-- Friction -->
  <g transform="translate(100, 480)">
    <rect x="0" y="100" width="300" height="20" fill="#555" rx="5" ry="5"/>
    <rect x="50" y="40" width="150" height="60" fill="#E0E0E0" stroke="white" stroke-width="3"/>
    <path d="M 220 70 L 290 70 M 270 55 L 290 70 L 270 85" stroke="#6366F1" stroke-width="10" fill="none"/>
    <path d="M 40 70 L 0 70 M 20 55 L 0 70 L 20 85" stroke="#F43F5E" stroke-width="10" fill="none"/>
    <text x="150" y="200" font-family="Arial, sans-serif" font-size="45" fill="white" text-anchor="middle">Friction</text>
    <text x="250" y="50" font-family="Arial, sans-serif" font-size="30" fill="#6366F1" text-anchor="middle">Applied Force</text>
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="30" fill="#F43F5E" text-anchor="middle">Friction Force</text>
  </g>

  <!-- Tension -->
  <g transform="translate(580, 480)">
    <rect x="100" y="100" width="100" height="60" fill="#E0E0E0" stroke="white" stroke-width="3"/>
    <line x1="200" y1="130" x2="280" y2="130" stroke="#F43F5E" stroke-width="5"/>
    <path d="M 280 130 L 265 120 L 280 130 L 265 140" stroke="#F43F5E" stroke-width="5" fill="none"/>
    <!-- Simplified hand -->
    <rect x="280" y="115" width="40" height="30" rx="5" ry="5" fill="#C2A88D"/>
    <text x="150" y="200" font-family="Arial, sans-serif" font-size="45" fill="white" text-anchor="middle">Tension</text>
    <text x="260" y="100" font-family="Arial, sans-serif" font-size="30" fill="#F43F5E" text-anchor="middle">Tension Force</text>
  </g>

  <!-- Normal Force -->
  <g transform="translate(250, 950)">
    <rect x="0" y="150" width="580" height="30" fill="#555" rx="5" ry="5"/>
    <rect x="190" y="80" width="200" height="70" fill="#E0E0E0" stroke="white" stroke-width="3"/>
    <path d="M 290 150 L 290 10 M 275 30 L 290 10 L 305 30" stroke="#10B981" stroke-width="10" fill="none"/>
    <path d="M 290 180 L 290 250 M 275 230 L 290 250 L 305 230" stroke="#6366F1" stroke-width="10" fill="none"/>
    <text x="290" y="270" font-family="Arial, sans-serif" font-size="30" fill="#6366F1" text-anchor="middle">Weight / Gravity</text>
    <text x="290" y="50" font-family="Arial, sans-serif" font-size="30" fill="#10B981" text-anchor="middle">Normal Force</text>
    <text x="290" y="300" font-family="Arial, sans-serif" font-size="45" fill="white" text-anchor="middle">Normal Force</text>
  </g>
</svg>