<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#0F172A" />
  <rect width="1080" height="1920" fill="#0F172A"/>

  <!-- Wall -->
  <rect x="600" y="500" width="300" height="700" fill="#2D3A4F" rx="20"/>

  <!-- Person Shape (abstracted) -->
  <rect x="250" y="700" width="150" height="400" fill="#3B82F6" rx="20"/>
  <circle cx="325" cy="650" r="70" fill="#3B82F6"/>

  <!-- Action Force (Person on Wall) -->
  <path d="M400 900 H550 M550 900 L530 880 M550 900 L530 920" stroke="#F43F5E" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="475" y="850" font-family="Arial, sans-serif" font-size="48" fill="#F43F5E" text-anchor="middle">Action</text>

  <!-- Reaction Force (Wall on Person) -->
  <path d="M600 900 H450 M450 900 L470 880 M450 900 L470 920" stroke="#6366F1" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="525" y="950" font-family="Arial, sans-serif" font-size="48" fill="#6366F1" text-anchor="middle">Reaction</text>

  <!-- Title/Question -->
  <text x="540" y="250" font-family="Arial, sans-serif" font-size="72" fill="#E2E8F0" text-anchor="middle">Pushing a Wall?</text>
  <text x="540" y="350" font-family="Arial, sans-serif" font-size="56" fill="#A0AEC0" text-anchor="middle">What happens when you push?</text>

</svg>